{% if evidence %}
  <details class="group inline text-sm" data-testid="inline-evidence">
    <summary class="ml-2 inline cursor-pointer list-none whitespace-nowrap font-medium text-violet-800 hover:underline [&::-webkit-details-marker]:hidden">
      <span class="inline-block transition-transform group-open:rotate-90" aria-hidden="true">▶</span>
      查看引用原文（{{ evidence|length }}）
    </summary>
    <div class="mt-3 space-y-3">
      {% for comment in evidence %}
        <blockquote class="border-l-4 {% if forloop.first %}border-violet-500{% else %}border-slate-300{% endif %} bg-white p-4">
          <p class="whitespace-pre-wrap break-words text-base leading-7 text-slate-700">{{ comment.comment_text }}</p>
          <footer class="mt-2 text-sm text-slate-500">{{ comment.author_display_name }} · 讚 {{ comment.like_count|default_if_none:"未知" }}</footer>
        </blockquote>
      {% endfor %}
    </div>
  </details>
{% endif %}
