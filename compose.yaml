name: tubesense-ai

services:
  redis:
    image: redis:7-alpine
    container_name: tubesense-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: tubesense-redisinsight
    ports:
      - "127.0.0.1:5541:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
    name: tubesense-redis-data
  redisinsight_data:
    name: tubesense-redisinsight-data
