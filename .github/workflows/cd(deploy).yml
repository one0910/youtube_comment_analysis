name: CD階段

on:
  workflow_run:
    workflows: [CI階段]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: tubesense-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.id == 1345044843
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      AWS_REGION: ap-southeast-1
      EC2_INSTANCE_ID: i-02ae0f67421f91786
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::236451047930:role/TubeSenseGitHubDeployRole
          aws-region: ap-southeast-1
          allowed-account-ids: "236451047930"

      - name: Deploy the CI-verified commit through SSM
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]

          remote_command="runuser -u ubuntu -- /bin/bash -c 'cd /home/ubuntu/tubesense-ai && git pull --ff-only origin main && /bin/bash scripts/git_update_script.sh $DEPLOY_SHA'"
          jq -n --arg command "$remote_command" \
            '{commands: [$command], executionTimeout: ["1800"]}' \
            > "$RUNNER_TEMP/tubesense-ssm-parameters.json"

          command_id=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "TubeSense deploy $DEPLOY_SHA" \
            --parameters "file://$RUNNER_TEMP/tubesense-ssm-parameters.json" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"

          for attempt in {1..190}; do
            status=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null) || status=Pending

            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                break
                ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --output json \
            | jq -r '"Status: \(.StatusDetails)\nExit code: \(.ResponseCode)\n--- stdout ---\n\(.StandardOutputContent)\n--- stderr ---\n\(.StandardErrorContent)"'

          [[ "$status" == Success ]]
