<div
  id="first-visit-intro"
  class="tubesense-first-visit-intro"
  role="status"
  aria-label="TubeSense AI 正在開啟"
  aria-hidden="true"
>
  <div class="tubesense-first-visit-intro__canvas">
    <svg
      class="tubesense-first-visit-intro__artwork"
      viewBox="0 0 500 380"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <defs>
        <linearGradient id="firstVisitBrandPurple" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a78bfa"></stop>
          <stop offset="0.5" stop-color="#8b5cf6"></stop>
          <stop offset="1" stop-color="#7c3aed"></stop>
        </linearGradient>
        <filter id="firstVisitPurpleGlow" x="-0.3" y="-0.3" width="1.6" height="1.6">
          <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
          <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
        </filter>
        <clipPath id="firstVisitTextReveal">
          <rect class="tubesense-first-visit-intro__reveal" x="20" y="210" width="0" height="120" rx="6"></rect>
        </clipPath>
      </defs>

      <g class="tubesense-first-visit-intro__icon">
        <circle cx="250" cy="110" r="72" fill="#8b5cf6" opacity="0.2" filter="url(#firstVisitPurpleGlow)"></circle>
        <circle
          class="tubesense-first-visit-intro__circle"
          cx="250"
          cy="110"
          r="62"
          fill="url(#firstVisitBrandPurple)"
          stroke="url(#firstVisitBrandPurple)"
          stroke-width="7.5"
          stroke-linecap="round"
        ></circle>
        <polygon
          class="tubesense-first-visit-intro__play"
          points="235,83 277,110 235,137"
          fill="#ffffff"
          stroke="#ffffff"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></polygon>
      </g>

      <g class="tubesense-first-visit-intro__text" clip-path="url(#firstVisitTextReveal)">
        <g text-anchor="middle" transform="translate(250, 252)">
          <text
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-size="38"
            font-weight="800"
            letter-spacing="-0.025em"
          >
            <tspan fill="#7c3aed">TubeSense</tspan>
            <tspan dx="8" fill="#8b5cf6">AI</tspan>
          </text>
        </g>
        <g class="tubesense-first-visit-intro__tagline" text-anchor="middle" transform="translate(250, 288)">
          <text
            fill="#8b5cf6"
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-size="13"
            font-weight="700"
            letter-spacing="0.22em"
          >YOUTUBE COMMENT INTELLIGENCE</text>
        </g>
      </g>

      <g class="tubesense-first-visit-intro__beam">
        <line
          x1="0"
          y1="218"
          x2="0"
          y2="300"
          stroke="#8b5cf6"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.95"
          filter="url(#firstVisitPurpleGlow)"
        ></line>
        <circle cx="0" cy="254" r="3.5" fill="#c084fc"></circle>
      </g>
    </svg>
  </div>
</div>
