{% load i18n %}

{% translate "處理中" as default_loading_title %}
{% translate "請稍候，系統正在處理資料。" as default_loading_message %}

<div id="{{ loading_element_id }}" 
    class="tubesense-htmx-indicator min-h-72 flex-col items-center justify-center rounded-2xl border border-app-border bg-white px-6 py-12 text-center shadow-sm {{ loading_container_classes|default:'' }}" 
    role="status" 
    aria-live="polite" 
    aria-busy="true"
  >
    <div class="relative mb-8 flex size-24 items-center justify-center">
        <div class="absolute inset-0 rounded-full bg-violet-200/50 shadow-[0_0_24px_rgba(139,92,246,0.25)] motion-safe:animate-pulse"></div>

        <div class="tubesense-loading-ring relative z-10 flex size-16 items-center justify-center rounded-full bg-gradient-to-tr from-violet-950 to-violet-400 p-0.5 shadow-lg">
            <div class="flex size-full items-center justify-center rounded-full bg-white">
                <svg class="size-8 text-brand-purple motion-safe:animate-[spin_3s_linear_infinite]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <rect x="7" y="7" width="10" height="10" rx="2"></rect>
                    <rect x="10" y="10" width="4" height="4" rx="0.5"></rect>
                    <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"></path>
                </svg>
            </div>
        </div>
    </div>

    <h2 class="flex items-center justify-center text-2xl font-bold text-brand-navy sm:text-3xl">
        {{ loading_title|default:default_loading_title }}
        <span class="ml-1 inline-flex text-brand-purple" aria-hidden="true">
            <span class="tubesense-loading-dot">.</span>
            <span class="tubesense-loading-dot">.</span>
            <span class="tubesense-loading-dot">.</span>
        </span>
    </h2>

    <p class="mt-3 text-base leading-7 text-slate-600">{{ loading_message|default:default_loading_message }}</p>

    <div class="relative mt-6 h-1.5 w-full max-w-xs overflow-hidden rounded-full bg-slate-200" aria-hidden="true">
        <div class="tubesense-loading-progress absolute inset-y-0 rounded-full bg-brand-purple"></div>
    </div>
</div>
